name: Build MAUI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install MAUI workload
      run: dotnet workload install maui-android

    - name: Restore packages
      run: dotnet restore BookSearch.csproj

    - name: Publish APK (готовый к установке)
      run: dotnet publish BookSearch.csproj -c Release -f net9.0-android -p:AndroidPackageFormat=apk -p:RuntimeIdentifier=android-arm64

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BookLibrary-APK
        path: '**/bin/Release/**/publish/*.apk'
        if-no-files-found: error
